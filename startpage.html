            { glow1: 'rgba(239, 68, 68, 0.08)', glow2: 'rgba(245, 158, 11, 0.08)' }, // Red & Amber

        ];

        // モーダル要素

        const shortcutUrlInput = document.getElementById('shortcut-url');
        const editIndexInput = document.getElementById('edit-index');

        const cancelModalBtn = document.getElementById('cancel-modal-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // Todo要素

        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const todoCount = document.getElementById('todo-count');

        // メモ・背景・テーマ・通知
        const quickNote = document.getElementById('quick-note');
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        const bgToggle = document.getElementById('bg-toggle');
        const settingsBtn = document.getElementById('settings-btn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // --- 初期化処理 ---
        window.addEventListener('DOMContentLoaded', () => {
            // ローカルストレージからデータ復元
            loadSettings();
            
            // 時計開始
            updateClock();
            setInterval(updateClock, 1000);

            // Lucideアイコンレンダリング
            lucide.createIcons();

            // リスナー登録
            setupEventListeners();

        // --- 設定ロード ---
        function loadSettings() {
            // テーマ復元
            currentTheme = localStorage.getItem('theme') || 'dark';
            applyTheme(currentTheme);

            // 背景復元
            currentBgIndex = parseInt(localStorage.getItem('bg-index')) || 0;
            applyBackground(currentBgIndex);

            // 検索エンジン復元
            selectedEngine = localStorage.getItem('search-engine') || 'google';
            setSearchEngine(selectedEngine);

            // ショートカット復元
            const savedShortcuts = localStorage.getItem('shortcuts');
            if (savedShortcuts) {
                shortcuts = JSON.parse(savedShortcuts);
            } else {
                shortcuts = [...defaultShortcuts];
                localStorage.setItem('shortcuts', JSON.stringify(shortcuts));
            }
            renderShortcuts();

            // Todo復元
            const savedTodos = localStorage.getItem('todos');
            if (savedTodos) {
                todos = JSON.parse(savedTodos);
            }
            renderTodos();

            // メモ復元
            const savedNote = localStorage.getItem('quick-note');
            if (savedNote) {
                quickNote.value = savedNote;
            }
        }

        // --- イベントリスナー設定 ---
        function setupEventListeners() {
            // 検索
            searchForm.addEventListener('submit', handleSearch);
            engineSelectBtn.addEventListener('click', () => {
                engineDropdown.classList.toggle('hidden');
            });

            // ドロップダウンの外をクリックしたら閉じる
            document.addEventListener('click', (e) => {
                if (!engineSelectBtn.contains(e.target) && !engineDropdown.contains(e.target)) {
                    engineDropdown.classList.add('hidden');
                }
            });

            // ショートカット追加

            closeModalBtn.addEventListener('click', closeShortcutModal);
            cancelModalBtn.addEventListener('click', closeShortcutModal);
            shortcutForm.addEventListener('submit', handleShortcutSubmit);
            deleteShortcutBtn.addEventListener('click', handleDeleteShortcut);

            // Todo追加
            todoForm.addEventListener('submit', handleTodoSubmit);

            themeToggle.addEventListener('click', toggleTheme);

            bgToggle.addEventListener('click', toggleBackground);

        // --- 時計 & 日付の表示更新 ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            clockEl.textContent = `${hours}:${minutes}:${seconds}`;

            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
            const day = dayNames[now.getDay()];

            dateEl.textContent = `${year}年${month}月${date}日 (${day})`;
        }

        // --- 検索の処理 ---
        function handleSearch(e) {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;

            // URLかどうかを判定
            const isUrl = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/.test(query);
